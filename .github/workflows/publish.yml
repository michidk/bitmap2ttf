name: Publish

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: "The git tag to publish"
        required: true
        type: string
  release:
    types: [published]

jobs:
  publish-cratesio:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    environment: publish-crates.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag-name || github.event.release.tag_name }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Upload bitmap2ttf to crates.io
        run: cargo publish -p bitmap2ttf --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Upload bitmap2ttf-cli to crates.io (with index retry)
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo publish -p bitmap2ttf-cli --locked; then
              exit 0
            fi
            echo "publish attempt ${attempt} failed; waiting for crates.io index propagation..."
            sleep 20
          done
          echo "failed to publish bitmap2ttf-cli after retries"
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
