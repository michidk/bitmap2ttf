name: Bump Version & Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3, without 'v' prefix)"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  bump-and-tag:
    name: Bump version and create tag
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure release token is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::Missing secret RELEASE_TOKEN."
            echo "::error::A PAT is required so push/tag events can trigger downstream workflows (e.g. release.yml)."
            exit 1
          fi

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '${{ inputs.version }}'. Expected semver (e.g. 1.2.3)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Bump versions in workspace crates
        run: |
          sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' bitmap2ttf/Cargo.toml
          sed -i 's/^version = ".*"/version = "${{ inputs.version }}"/' bitmap2ttf-cli/Cargo.toml
          sed -i 's/^bitmap2ttf = { version = ".*", path = "..\/bitmap2ttf" }/bitmap2ttf = { version = "${{ inputs.version }}", path = "..\/bitmap2ttf" }/' bitmap2ttf-cli/Cargo.toml

      - name: Update Cargo.lock
        run: cargo generate-lockfile

      - name: Verify versions were set
        run: |
          lib_ver=$(grep '^version = ' bitmap2ttf/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          cli_ver=$(grep '^version = ' bitmap2ttf-cli/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          dep_ver=$(grep '^bitmap2ttf = ' bitmap2ttf-cli/Cargo.toml | sed 's/.*version = "\([^"]*\)".*/\1/')

          if [[ "$lib_ver" != "${{ inputs.version }}" ]]; then
            echo "::error::Library version mismatch: expected '${{ inputs.version }}', got '$lib_ver'"
            exit 1
          fi

          if [[ "$cli_ver" != "${{ inputs.version }}" ]]; then
            echo "::error::CLI version mismatch: expected '${{ inputs.version }}', got '$cli_ver'"
            exit 1
          fi

          if [[ "$dep_ver" != "${{ inputs.version }}" ]]; then
            echo "::error::CLI dependency version mismatch: expected '${{ inputs.version }}', got '$dep_ver'"
            exit 1
          fi

          echo "Versions set to $lib_ver"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bitmap2ttf/Cargo.toml bitmap2ttf-cli/Cargo.toml Cargo.lock
          git commit -m "release: v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"

      - name: Push commit and tag
        run: git push origin HEAD "v${{ inputs.version }}"
